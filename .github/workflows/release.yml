name: Release a plugin

# Pushing a tag such as hsbc-v0.2.0 releases that plugin: it's built for WASI and packaged,
# the package is attached to a GitHub release, and a pull request points plugins.json at it.
# Once that's merged, PennyChest offers the new version in Settings > Plugins. main only takes
# pull requests, so the pull request is opened as the release GitHub App, whose pull requests
# run CI.

on:
  push:
    tags: ["*-v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain
      - name: Package
        id: package
        run: |
          tag=${GITHUB_REF_NAME}
          name=${tag%-v*}
          version=${tag##*-v}
          entry=$(EXPECTED_VERSION="$version" tools/package.sh "$name")
          echo "$entry"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "file=$(echo "$entry" | python3 -c 'import json,sys; print(json.load(sys.stdin)["file"])')" >> "$GITHUB_OUTPUT"
          echo "sha256=$(echo "$entry" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha256"])')" >> "$GITHUB_OUTPUT"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk '/^## /{n++} n==1' "${{ steps.package.outputs.name }}/CHANGELOG.md" | tail -n +2)
          gh release create "$GITHUB_REF_NAME" "dist/${{ steps.package.outputs.file }}" \
            --title "${{ steps.package.outputs.name }} ${{ steps.package.outputs.version }}" \
            --notes "$notes"
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open a pull request pointing plugins.json at it
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          name="${{ steps.package.outputs.name }}"
          version="${{ steps.package.outputs.version }}"
          branch="release/$GITHUB_REF_NAME"
          git fetch origin main
          git checkout -b "$branch" origin/main
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${{ steps.package.outputs.file }}"
          python3 tools/update_index.py "$name" "$version" "$url" "${{ steps.package.outputs.sha256 }}"
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -am "🔖 $name $version in plugins.json"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          gh pr create --base main --head "$branch" \
            --title "🔖 $name $version in plugins.json" \
            --body "Lists $name $version, released as $GITHUB_REF_NAME, so PennyChest offers it in Settings > Plugins."
